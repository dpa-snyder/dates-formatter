name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0
  NFPM_VERSION: v2.46.3
  NODE_VERSION: '20'
  GO_VERSION: '1.24'

jobs:
  verify:
    name: Verify tests, docs, and audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: wails-app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install frontend deps
        working-directory: wails-app/frontend
        run: npm ci

      - name: Audit frontend deps
        working-directory: wails-app/frontend
        run: npm audit --audit-level=moderate

      - name: Build frontend
        working-directory: wails-app/frontend
        run: npm run build

      - name: Test Go backend
        working-directory: wails-app
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Test legacy Python parser
        run: python -m unittest discover -s tests -q

      - name: Lint workflow
        uses: rhysd/actionlint@v1

      - name: Validate static HTML
        run: |
          sudo apt-get install -y tidy
          tidy -qe index.html
          tidy -qe user-manual.html

  windows:
    name: Windows Wails GUI (amd64)
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: wails-app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VER"
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Wails doctor
        shell: pwsh
        working-directory: wails-app
        run: wails doctor

      - name: Install frontend deps
        shell: pwsh
        working-directory: wails-app/frontend
        run: npm ci

      - name: Sync user manual into public
        shell: pwsh
        run: Copy-Item user-manual.html wails-app/frontend/public/user-manual.html -Force

      - name: Build EXE
        shell: pwsh
        working-directory: wails-app
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          $tag = if ($env:BUILD_VERSION -match '^v') { $env:BUILD_VERSION } else { "dev" }
          wails build -platform windows/amd64 -clean -webview2 download -o date-formatter.exe -ldflags "-X 'main.version=$tag'"
          New-Item -ItemType Directory -Force -Path build\release | Out-Null
          Copy-Item build\bin\date-formatter.exe "build\release\date-formatter-$tag-windows-amd64.exe" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-formatter-windows-amd64
          path: wails-app/build/release/*
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macOS Wails GUI (arm64)
    runs-on: macos-15
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: wails-app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Wails CLI
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails doctor
        working-directory: wails-app
        run: wails doctor

      - name: Install frontend deps
        working-directory: wails-app/frontend
        run: npm ci

      - name: Sync user manual into public
        run: cp user-manual.html wails-app/frontend/public/user-manual.html

      - name: Build app bundle
        working-directory: wails-app
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${BUILD_VERSION}" == v* ]]; then
            tag="${BUILD_VERSION}"
          else
            tag="dev"
          fi
          wails build -platform darwin/arm64 -clean -o date-formatter -ldflags "-X 'main.version=${tag}'"
          codesign --verify --deep --strict --verbose=2 build/bin/date-formatter.app
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent build/bin/date-formatter.app "build/release/date-formatter-${tag}-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-formatter-macos-arm64
          path: wails-app/build/release/*
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Linux Wails GUI (amd64)
    runs-on: ubuntu-24.04
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: wails-app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Wails and nFPM
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
          NFPM_VER: ${{ env.NFPM_VERSION }}
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VER}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend deps
        working-directory: wails-app/frontend
        run: npm ci

      - name: Sync user manual into public
        run: cp user-manual.html wails-app/frontend/public/user-manual.html

      - name: Build Linux binary and packages
        working-directory: wails-app
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${BUILD_VERSION}" == v* ]]; then
            tag="${BUILD_VERSION}"
            pkg_version="${BUILD_VERSION#v}"
          else
            tag="dev"
            pkg_version="0.0.0"
          fi

          wails build -platform linux/amd64 -clean -tags webkit2_41 -o date-formatter -ldflags "-X 'main.version=${tag}'"

          mkdir -p build/release "build/package/date-formatter-${tag}-linux-amd64"
          cp build/bin/date-formatter "build/package/date-formatter-${tag}-linux-amd64/date-formatter"
          cp ../user-manual.html "build/package/date-formatter-${tag}-linux-amd64/user-manual.html"
          chmod +x "build/package/date-formatter-${tag}-linux-amd64/date-formatter"
          tar -czf "build/release/date-formatter-${tag}-linux-amd64.tar.gz" -C build/package "date-formatter-${tag}-linux-amd64"

          VERSION="${pkg_version}" nfpm package --config ../packaging/linux/nfpm.yaml --packager deb --target "build/release/date-formatter-${tag}-linux-amd64.deb"
          VERSION="${pkg_version}" nfpm package --config ../packaging/linux/nfpm.yaml --packager rpm --target "build/release/date-formatter-${tag}-linux-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-formatter-linux-amd64
          path: wails-app/build/release/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
      - linux

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release artifacts
        run: find release-assets -maxdepth 3 -type f -print | sort

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — all-platform desktop release
          body: |
            ## Changes
            - Adds safer overwrite commits through temporary output files and backup fallback.
            - Persists Wails mode, output, recent files, and YY-prefix settings.
            - Disambiguates duplicate or blank source headers before conversion.
            - Adds release verification gates for Go, Python, frontend, audit, workflow lint, and HTML validation.
            - Ships automated Windows, macOS, and Linux release builds.
            - Includes Linux package-manager artifacts: `.deb` for Debian/Ubuntu-family systems and `.rpm` for Fedora/RHEL-family systems.
            - Keeps a plain Linux `.tar.gz` fallback for systems where package dependencies need manual handling.

            ## Assets
            - `date-formatter-${{ github.ref_name }}-windows-amd64.exe`
            - `date-formatter-${{ github.ref_name }}-macos-arm64.zip`
            - `date-formatter-${{ github.ref_name }}-linux-amd64.deb`
            - `date-formatter-${{ github.ref_name }}-linux-x86_64.rpm`
            - `date-formatter-${{ github.ref_name }}-linux-amd64.tar.gz`

            ## Linux notes
            The Linux app uses GTK and WebKitGTK. The `.deb` and `.rpm` packages declare runtime dependencies for common Debian/Ubuntu and Fedora/RHEL-family systems. If those package names do not exist on a distro, use the `.tar.gz` fallback and install the distro's GTK3 and WebKitGTK 4.1 runtime packages manually.

            ## Signing status
            Public builds are not yet code-signed or Apple-notarized. Browsers, Windows SmartScreen, and macOS Gatekeeper may show trust prompts. Enterprise or IT-managed builds may be signed separately and behave differently.
          files: release-assets/**/*
